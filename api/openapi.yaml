    QuotaDetail:
      description: "Structured detail accompanying a `quota_exceeded` 429. Present\
        \ only on that response; absent from every other error body. It answers, in\
        \ machine-readable form, what the limit is, how much was used, when it resets,\
        \ and where to raise it — the same four facts `error.message` repeats in prose\
        \ for the benefit of log lines and stack traces."
