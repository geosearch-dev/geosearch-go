        type: integer
      style: form
    within:
      description: |-
        Return only results whose coordinates fall geometrically inside the boundary of the given area, identified by its GeoNames id. Countries and administrative regions are valid areas; a city id is not.

        Accepts exactly one id. A COMMA-SEPARATED LIST IS REJECTED with a 422 naming the limit — a deliberate departure from the comma-separated convention `country` uses, because each value would be a separate polygon intersection. Ask for one area per request.

        COST: a request using this parameter consumes 2 quota units instead of 1, on every plan including Free. Combining it with `bbox` still costs 2, not 3 — the highest multiplier applies rather than the sum, and adding a box makes the query cheaper to serve, so it is never penalised.

        This asks a GEOMETRIC question and can therefore return a different set of cities than `/v1/regions/{id}/cities`, which asks an administrative one. See that endpoint's description for when and why the two disagree.

        Two failures are reported with distinct 400 codes so a typo is distinguishable from a coverage gap: `area_not_an_area` means the id does not name a country or region at all, and `area_no_boundary` means it does but no boundary polygon is available for it yet.
      example: 6252001
      explode: true
      in: query
      name: within
      required: false
      schema:
        format: int64
        type: integer
      style: form
    bbox:
      description: |-
        Return only results inside the bounding box, given as four comma-separated numbers in the order `w,s,e,n` — west longitude, south latitude, east longitude, north latitude.

        Longitudes must be within [-180, 180] and latitudes within [-90, 90].

        A box where WEST IS GREATER THAN EAST wraps the antimeridian and is fully supported: `bbox=170,-20,-170,-10` is a box around Fiji, evaluated as the union of the two halves it spans. Latitude has no equivalent wrap-around meaning, so `s` greater than `n` is a validation error rather than a wrapped box.

        Charged at the standard request cost of 1 unit. Adding it to a `within` query narrows the candidate set before the polygon test and does not raise the charge.
      example: "-122.6,37.6,-122.2,37.9"
      explode: true
      in: query
      name: bbox
      required: false
      schema:
        pattern: "^-?\\d+(\\.\\d+)?(,-?\\d+(\\.\\d+)?){3}$"
        type: string
      style: form
  responses:
    BadRequest:
      content:
        application/json:
          example:
            error:
              code: validation_error
              message: Invalid request parameters
              details:
              - field: population_min
                issue: must be a valid integer
              request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request parameters
    AreaBadRequest:
      content:
        application/json:
          examples:
            notAnArea:
              description: "The id names something other than a country or a region\
                \ — most often a city id, since `within` and the city endpoints both\
                \ use GeoNames ids — or names nothing at all. Retrying will not help;\
                \ supply the id of a country or region."
              summary: The within id is not an area
              value:
                error:
                  code: area_not_an_area
                  message: "The `within` parameter must be the GeoNames id of a country\
                    \ or a region, for example within=6252001 for the United States.\
                    \ The id supplied names something else — a city, for instance\
                    \ — or names nothing at all."
                  request_id: req_abc123
            noBoundary:
              description: "The id names a real country or region, but no boundary\
                \ is available for it, so containment cannot be computed. Coverage\
                \ is strongest for countries and first- and second-level regions and\
                \ thins out below that. An empty 200 was deliberately NOT used here:\
                \ it would be indistinguishable from \"no results inside this area\"\
                , which is a different and far more misleading answer."
              summary: No boundary polygon is held for that area
              value:
                error:
                  code: area_no_boundary
                  message: "That area exists, but no boundary polygon is available\
                    \ for it yet, so containment cannot be computed. Boundary coverage\
                    \ is strongest for countries and first- and second-level regions;\
                    \ see the documentation for current coverage."
                  request_id: req_abc123
            badRequest:
              summary: "A malformed cursor, sort or pagination value"
              value:
                error:
                  code: bad_request
                  message: invalid cursor
                  request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Invalid request. Distinguish the cases by `error.code`: `bad_request`\
        \ is a malformed cursor, sort or pagination value; `area_not_an_area` means\
        \ the `within` id does not name a country or region; `area_no_boundary` means\
        \ it names a real area for which no boundary polygon is available. The last\
        \ two are separate codes on purpose — one is a mistake the caller can fix,\
        \ the other is a limit of our data that they cannot."
    ValidationFailed:
      content:
        application/json:
          examples:
            multipleAreas:
              summary: More than one area requested
              value:
                error:
                  code: validation_error
                  message: Validation failed
                  details:
                  - field: within
                    issue: accepts exactly one geoname_id; comma-separated lists are
                      not supported
                  request_id: req_abc123
            invertedLatitude:
              summary: A bounding box whose south edge is north of its north edge
              value:
                error:
                  code: validation_error
                  message: Validation failed
                  details:
                  - field: bbox
                    issue: south latitude must be less than north latitude
                  request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: One or more query parameters were malformed. `error.details` names
        each offending field and what was wrong with it.
    AreaQueryTimeout:
      content:
        application/json:
          example:
            error:
              code: area_query_timeout
              message: "The containment query for that area took too long to complete.\
                \ This is usually temporary — please retry. If it persists, narrow\
                \ the query by adding a bbox or additional filters."
              request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |-
        The containment query exceeded the statement timeout that bounds it.

        This is a 503 and NOT a 500, deliberately: the server is healthy and the request was valid — this one query against an unusually large or complex boundary simply ran out of its time budget. It is therefore worth retrying, and worth retrying with a narrower query. Adding `bbox` or further filters alongside `within` reduces the candidate set before the polygon test and is the most effective remedy.

        THIS RESPONSE BELONGS TO THE `within=` ROUTES ONLY. `GET /v1/resolve` and `GET /v1/boundaries/{geoname_id}` have their own 503 components (`ResolveQueryTimeout` and `BoundaryQueryTimeout`) because the remedy above is false on both: neither accepts `bbox` or `within`.
    ResolveQueryTimeout:
      content:
        application/json:
          example:
            error:
              code: area_query_timeout
              message: The point-in-polygon probe took too long to complete. This
                is usually temporary — please retry.
              request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |-
        The point-in-polygon probe exceeded the statement timeout that bounds it.

        This is a 503 and NOT a 500, deliberately: the server is healthy and the request was valid — this one probe against an unusually complex set of candidate polygons simply ran out of its time budget. It is worth retrying.

        There is no narrower query to send. This operation takes a single coordinate; there is no `bbox`, no `within` and no filter set to reduce. Retry, and if the failure persists for a particular coordinate, report it — a coordinate that reliably times out is a data problem on our side, not a malformed request on yours.
    BoundaryQueryTimeout:
      content:
        application/json:
          example:
            error:
              code: area_query_timeout
              message: "Building that boundary polygon took too long to complete.\
                \ This is usually temporary — please retry, or ask for a coarser polygon\
                \ with a larger ?simplify= tolerance."
              request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Building the boundary polygon exceeded the statement timeout that bounds it.

        This is a 503 and NOT a 500, deliberately: the server is healthy and the request was valid — this one polygon is large enough that assembling and serialising it ran out of its time budget. It is worth retrying.

        THE EFFECTIVE REMEDY ON THIS ROUTE IS `simplify`, not `bbox` — this operation has no `bbox` and no `within`. A larger tolerance means fewer vertices to generalise, serialise and transmit, so a request that times out at the full resolution frequently succeeds at `?simplify=0.01`.
    TierUpgradeRequired:
      content:
        application/json:
          example:
            error:
              code: tier_upgrade_required
              message: Boundary geometry is not included on your current plan. Upgrade
                to fetch boundary polygons.
              request_id: req_abc123
              upgrade:
                upgrade_url: https://geosearch.dev/dashboard#billing
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |-
        The authenticated key's plan does not include the requested feature.

        NOT RETRYABLE, AND THIS MATTERS FOR CLIENT CODE. Generated SDKs and hand-written clients commonly retry 429 with backoff. This is a 403 and must not be routed into that path: no amount of waiting changes the answer, because nothing is exhausted and no window resets. The only resolution is to raise the plan at `error.upgrade.upgrade_url`.

        It carries no `Retry-After` and no `X-RateLimit-*` semantics of its own, which is the machine-readable form of the same statement.
    BoundaryNotFound:
      content:
        application/json:
          examples:
            notAnArea:
              description: "The id names something other than a country or a region\
                \ — most often a city id, since this path and the city endpoints both\
                \ use GeoNames ids — or names nothing at all. Retrying will not help."
              summary: The id is not an area
              value:
                error:
                  code: area_not_an_area
                  message: "The path segment must be the GeoNames id of a country\
                    \ or a region. The id supplied names something else — a city,\
                    \ for instance — or names nothing at all."
                  request_id: req_abc123
            noBoundary:
              summary: No boundary polygon is held for that area
              value:
                error:
                  code: area_no_boundary
                  message: "That area exists, but we hold no boundary polygon for\
                    \ it yet. Coverage is strongest for countries and for first- and\
                    \ second-level regions; see the documentation for the current\
                    \ coverage map."
                  request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |-
        No boundary can be returned for that id. Distinguish the two cases by `error.code`: `area_not_an_area` means the id does not name a country or a region at all, and `area_no_boundary` means it names a real area for which no boundary polygon is held. One is a mistake the caller can fix; the other is a limit of our data that they cannot.

        `area_no_boundary` is returned REGARDLESS OF PLAN, and is checked before the plan is. A Free key asking about a region we hold no polygon for is told we do not have it, not that an upgrade would produce it — an upgrade would not.
    ResolveNotFound:
      content:
        application/json:
          example:
            error:
              code: not_found
              message: "administrative area not found: covering these coordinates"
              request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |-
        No administrative area covers the supplied coordinate.

        EXACTLY ONE CODE, AND THE MESSAGE CLAIMS NOTHING ABOUT WHY. Two distinct situations produce this response — the point is in open water, or it is on land we hold no polygon for — and the server genuinely cannot tell them apart. Reporting a confident cause would be wrong a predictable fraction of the time, so it reports neither.

        This is not an exotic path and should be handled as a normal outcome: measured over a random 19,558-city sample, 0.70% of cities resolve to no country polygon at all.

        An empty 200 was rejected: an empty array cannot be told apart from a successful "nothing matched".
    Unauthorized:
      content:
        application/json:
          examples:
            missing:
              summary: No API key was supplied
              value:
                error:
                  code: authentication_required
                  message: API key required. Get one at /signup
                  request_id: req_abc123
            invalid:
              summary: The supplied API key is not valid
              value:
                error:
                  code: authentication_failed
                  message: Invalid API key
                  request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Missing or invalid API key. Distinguish the two cases by `error.code`: `authentication_required` means no key was supplied at all, and `authentication_failed` means a key was supplied and is not valid.

        The distinction is worth branching on, because the remedies differ: the first is "sign up and send a key", the second is "the key you sent is wrong, revoked or mistyped".
    NotFound:
      content:
        application/json:
          example:
            error:
              code: not_found
              message: The requested resource was not found
              request_id: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    RateLimited:
      content:
        application/json:
          examples:
            throttle:
              description: The account exceeded its plan's requests-per-second allowance.
                Retryable within a second; no `error.quota` object is present.
              summary: Per-second throttle exceeded
              value:
                error:
                  code: rate_limit_exceeded
                  message: Rate limit exceeded. Try again later.
                  request_id: req_abc123
            quota:
              description: The account consumed its full monthly allowance. Retrying
                will not help until `error.quota.resets_at`; the plan must be raised
                or the period must roll over.
              summary: Monthly quota exhausted
              value:
                error:
                  code: quota_exceeded
                  message: "Monthly quota exhausted. You've used 2,000,000 of 2,000,000\
                    \ requests for the current period, which resets on March 1, 2026.\
                    \ Upgrade for a higher limit."
                  request_id: req_abc123
                  quota:
                    limit: 2000000
                    used: 2000000
                    resets_at: 2026-03-01T00:00:00Z
                    upgrade_url: https://geosearch.dev/dashboard/billing
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Rate limit exceeded. Distinguish the two cases by `error.code`:\
        \ `rate_limit_exceeded` is the per-second throttle and clears within a second;\
        \ `quota_exceeded` is the monthly allowance and carries an `error.quota` object\
        \ describing the limit, the usage, the period end and where to upgrade."
      headers:
        X-RateLimit-Limit:
          description: Requests per second allowed
          explode: false
          schema:
            type: integer
          style: simple
        X-RateLimit-Remaining:
          description: Requests remaining in current window
          explode: false
          schema:
            type: integer
          style: simple
        X-RateLimit-Reset:
          description: "Unix epoch second at which the limit that tripped resets.\
            \ An absolute timestamp, not a duration. For `rate_limit_exceeded` this\
            \ is the next per-second window boundary; for `quota_exceeded` it is the\
            \ end of the monthly quota period and may be weeks away."
          explode: false
          schema:
            format: int64
            type: integer
          style: simple
        Retry-After:
          description: "Seconds to wait before retrying. Sent on both 429 codes; only\
            \ its magnitude differs — around a second for the throttle, up to the\
            \ remainder of the billing period for the quota wall. Floored at 1, so\
            \ it never instructs a client to retry immediately."
          explode: false
          schema:
            type: integer
          style: simple
