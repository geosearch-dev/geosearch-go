        Structured detail accompanying a `tier_upgrade_required` 403. Present only on that response; absent from every other error body.

        ONE FIELD, DELIBERATELY. It says where to go and claims nothing else. It carries no limit, no usage and no reset instant, because none of those describe a plan that simply does not include the feature — there is no quantity to wait for and nothing resets.
