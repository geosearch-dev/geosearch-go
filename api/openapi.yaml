        - AF
        - AN
        - AS
        - EU
        - NA
        - OC
        - SA
        type: string
      style: form
    lang:
      description: "ISO 639-1 language code for localized names (e.g., de, fr, ja)"
      example: de
      explode: true
      in: query
      name: lang
      required: false
      schema:
        maxLength: 5
        minLength: 2
        type: string
      style: form
    population_min:
