openapi: 3.1.0
info:
  contact:
    email: info@geosearch.dev
    name: GeoSearch Support
  description: |
    Geographic data REST API — modern replacement for GeoNames.

    Serves countries, regions, cities, postal codes, and timezones
    through a fast, well-documented JSON API with cursor-based pagination and field selection.

    ## Authentication
    All endpoints (except health check) require an API key passed via the `X-API-Key` header.

    ## Rate Limiting
    Two independent limits apply to every authenticated request: a per-second
    throttle and a monthly quota. They fail with different error codes because
    they call for different client behaviour — `rate_limit_exceeded` means back
    off for a moment, `quota_exceeded` means the plan's monthly allowance is
    exhausted until the period resets.

    Responses include rate limit headers:
    - `X-RateLimit-Limit` — requests per second allowed
    - `X-RateLimit-Remaining` — requests remaining in current window
    - `X-RateLimit-Reset` — **Unix epoch second** at which the applicable limit
      resets. This is an absolute timestamp, not a duration. On a
      `quota_exceeded` response it carries the end of the monthly quota period
      rather than the next second boundary.
    - `X-Monthly-RateLimit-Limit` — monthly quota
    - `X-Monthly-RateLimit-Remaining` — monthly requests remaining
    - `X-RateLimit-Upgrade` — advisory message, present only once monthly usage
      passes 80% of the plan's quota
    - `Retry-After` — seconds to wait before retrying. Present on both 429s and
      the unambiguous duration; prefer it over deriving one from
      `X-RateLimit-Reset`.

    ## Pagination
    List endpoints use cursor-based pagination with `cursor` and `limit` parameters.
    Maximum limit is 100. Responses include pagination metadata in the `meta` object.

    ## Field Selection
    Use `?fields=name,population` on any endpoint to receive only the specified fields.
  license:
    name: MIT
  title: GeoSearch
  version: 1.3.3
servers:
- url: https://geosearch.dev
security:
- apiKeyAuth: []
tags:
- description: API health and status
  name: Health
- description: Country data and regions within countries
  name: Countries
- description: Administrative regions/states/provinces
  name: Regions
- description: City data with geographic coordinates
  name: Cities
- description: Postal/ZIP codes with nearest-neighbor search
  name: Postal Codes
- description: IANA timezone data
  name: Timezones
- description: Cross-type fuzzy text search
  name: Search
- description: "Boundary polygons as GeoJSON. Charges 5 quota units per served polygon;\
    \ region boundaries require a paid plan, country boundaries do not."
  name: Boundaries
- description: Batch lookup endpoints for multiple entities in a single request
  name: Batch
paths:
  /v1/status:
    get:
      description: Returns the API health status and database connectivity. No authentication
        required.
      operationId: getStatus
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  status: healthy
                  database: connected
              schema:
                $ref: "#/components/schemas/getStatus_200_response"
          description: API status
      security: []
      summary: Health check
      tags:
      - Health
      x-quota-cost:
        base: 1
      x-codeSamples:
      - lang: curl
        source: |
          # /v1/status needs no API key; every other endpoint requires -H "X-API-Key: YOUR_KEY"
          curl https://geosearch.dev/v1/status
      - lang: Go
        source: |
          // go get github.com/geosearch-dev/geosearch-go
          client := geosearch.NewAPIClient(geosearch.NewConfiguration())
          ctx := context.WithValue(context.Background(), geosearch.ContextAPIKeys,
              map[string]geosearch.APIKey{"apiKeyAuth": {Key: "YOUR_KEY"}})
          status, _, err := client.HealthAPI.GetStatus(ctx).Execute()
      - lang: Python
        source: |
          # pip install git+https://github.com/geosearch-dev/geosearch-python.git
          import geosearch

          cfg = geosearch.Configuration(api_key={"apiKeyAuth": "YOUR_KEY"})
          with geosearch.ApiClient(cfg) as client:
              status = geosearch.HealthApi(client).get_status().data
      - lang: TypeScript
        source: |
          // npm install github:geosearch-dev/geosearch-typescript
          import { Configuration, HealthApi } from "@geosearch/client";

          const api = new HealthApi(new Configuration({ apiKey: "YOUR_KEY" }));
          const status = (await api.getStatus()).data;
      - lang: Ruby
        source: |
          # gem 'geosearch', git: 'https://github.com/geosearch-dev/geosearch-ruby.git'
          require "geosearch"

          GeoSearch.configure { |c| c.api_key["X-API-Key"] = "YOUR_KEY" }
          status = GeoSearch::HealthApi.new.get_status.data
      - lang: PHP
        source: |
          // composer config repositories.geosearch vcs https://github.com/geosearch-dev/geosearch-php.git
          // composer require geosearch-dev/geosearch-php
          $cfg = GeoSearch\Configuration::getDefaultConfiguration()
              ->setApiKey("X-API-Key", "YOUR_KEY");
          $status = (new GeoSearch\Api\HealthApi(null, $cfg))->getStatus()->getData();
  /v1/countries:
    get:
      description: Returns a paginated list of countries with optional filtering and
        sorting.
      operationId: listCountries
      parameters:
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/continent"
      - description: Filter by ISO alpha-2 codes (comma-separated)
        example: "US,CA,GB"
        explode: true
        in: query
        name: iso_code
        required: false
        schema:
          type: string
        style: form
      - $ref: "#/components/parameters/population_min"
      - $ref: "#/components/parameters/population_max"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/fields"
      - description: "Sort field and direction. Allowed: name, population, area_sq_km.\
          \ Prefix with - for descending."
        example: -population
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - id: 1
                  iso_code: US
                  iso3_code: USA
                  name: United States
                  capital: Washington
                  population: 331002651
                  continent_code: NA
                  flag_emoji: 🇺🇸
                meta:
                  next_cursor: eyJpZCI6MjV9
                  has_next: true
                  has_prev: false
                  count: 25
              schema:
                $ref: "#/components/schemas/CountryListResponse"
          description: List of countries
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: List countries
      tags:
      - Countries
      x-quota-cost:
        base: 1
      x-codeSamples:
      - lang: curl
        source: |
          curl -H "X-API-Key: YOUR_KEY" \
            "https://geosearch.dev/v1/countries?continent=EU&limit=10"
      - lang: Go
        source: |
          // go get github.com/geosearch-dev/geosearch-go
          client := geosearch.NewAPIClient(geosearch.NewConfiguration())
          ctx := context.WithValue(context.Background(), geosearch.ContextAPIKeys,
              map[string]geosearch.APIKey{"apiKeyAuth": {Key: "YOUR_KEY"}})
          countries, _, err := client.CountriesAPI.ListCountries(ctx).Continent("EU").Limit(10).Execute()
      - lang: Python
        source: |
          # pip install git+https://github.com/geosearch-dev/geosearch-python.git
          import geosearch

          cfg = geosearch.Configuration(api_key={"apiKeyAuth": "YOUR_KEY"})
          with geosearch.ApiClient(cfg) as client:
              countries = geosearch.CountriesApi(client).list_countries(continent="EU", limit=10).data
      - lang: TypeScript
        source: |
          // npm install github:geosearch-dev/geosearch-typescript
          import { Configuration, CountriesApi } from "@geosearch/client";

          const api = new CountriesApi(new Configuration({ apiKey: "YOUR_KEY" }));
          const countries = (await api.listCountries({ continent: "EU", limit: 10 })).data;
      - lang: Ruby
        source: |
          # gem 'geosearch', git: 'https://github.com/geosearch-dev/geosearch-ruby.git'
          require "geosearch"

          GeoSearch.configure { |c| c.api_key["X-API-Key"] = "YOUR_KEY" }
          countries = GeoSearch::CountriesApi.new.list_countries(continent: "EU", limit: 10).data
      - lang: PHP
        source: |
          // composer config repositories.geosearch vcs https://github.com/geosearch-dev/geosearch-php.git
          // composer require geosearch-dev/geosearch-php
          $cfg = GeoSearch\Configuration::getDefaultConfiguration()
              ->setApiKey("X-API-Key", "YOUR_KEY");
          $countries = (new GeoSearch\Api\CountriesApi(null, $cfg))->listCountries(null, "EU");
          // lang, continent shown — the remaining 7 parameters are positional and optional
