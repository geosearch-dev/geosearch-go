        type:
          enum:
          - city
          - region
          - country
          - continent
          example: city
          type: string
        depth:
          description: |-
            THE DIRECTION DEPENDS ON THE ENDPOINT, because this schema is shared by two operations that number their nodes from opposite ends.

            On `GET /v1/cities/{id}/hierarchy` depth counts UP from the entity asked about: `depth: 0` is the city and the country carries the HIGHEST depth. On `GET /v1/resolve` depth is POSITIONAL, counting outward-in: `depth: 0` is the COUNTRY. Code that sorts or indexes on this field across both endpoints without accounting for the inversion silently REVERSES the hierarchy rather than failing — `max(by: depth)` returns the country on one and the innermost region on the other.

            On `/v1/resolve` depth is the ARRAY INDEX and NOT an administrative level. A chain may skip a level: a measured 3.8% of coordinates resolve to a country plus a level-2 region with no level-1 region, and in those `depth: 1` is a level-2 area. `HierarchyNode` carries no `level` field, so there is no second signal to disambiguate with — treat depth as position only.
          example: 0
          type: integer
