        maximum: 100
        minimum: 1
        type: integer
      style: form
    fields:
      description: Comma-separated list of fields to include in the response
      example: "name,population,iso_code"
      explode: true
      in: query
      name: fields
      required: false
      schema:
        type: string
      style: form
    continent:
      description: "Filter by continent code (AF, AN, AS, EU, NA, OC, SA)"
      example: EU
      explode: true
      in: query
