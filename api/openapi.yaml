  /v1/resolve:
    get:
      description: |
        Returns the administrative areas whose BOUNDARY POLYGONS CONTAIN the
        given coordinate, ordered country first.

        ## How this differs from `/v1/reverse`

        These two endpoints take the same parameters and answer different
        questions, and the difference is the reason both exist.

        `/v1/reverse` returns the NEAREST city. It always returns something, and
        for a point near a border that something is sometimes in the
        neighbouring country.

        `/v1/resolve` returns the areas that actually CONTAIN the point. It is
        never wrong about which country a point is in — and it sometimes returns
        nothing at all, because no polygon covers the point or because we hold no
        polygon for that country. Choose this endpoint when correctness at
        borders matters and choose `/v1/reverse` when you always need an answer.

        ## `depth` RUNS THE OPPOSITE DIRECTION FROM `/v1/cities/{id}/hierarchy`

        Read this before writing code that consumes both endpoints.

        Both return the same node SHAPE — `geoname_id`, `name`, `type`, `depth`
        — so one rendering path can accept either. The `depth` SEMANTICS are
        inverted between them:

        - On **this** endpoint `depth` is POSITIONAL, counting outward-in from
          the largest area: **`depth: 0` is the COUNTRY**, `depth: 1` is the
          region inside it, and so on.
        - On **`/v1/cities/{id}/hierarchy`** `depth` counts up from the entity
          that was asked about: `depth: 0` is the CITY, and the country is at the
          highest depth in the list.

        So `data[0]` is the country here and the city there. Code that sorts or
        indexes on `depth` across both endpoints without accounting for this will
        silently invert the hierarchy rather than fail.

        ## Cost and availability

        One quota unit, on every plan including Free. This is a single indexed
        point-in-polygon probe returning names, not a geometry transfer, so it
        carries no premium and no tier gate.

        `?fields=` IS NOT SUPPORTED on this endpoint and is ignored if sent.
        The four node fields are all small, so selection would save nothing.
      operationId: resolveCoordinate
      parameters:
      - description: "Latitude (-90 to 90). Must be a finite number: `NaN` and `Infinity`\
          \ are rejected with a 400 rather than being passed to the spatial index,\
          \ which would answer them with an ordinary \"not found\"."
        example: 37.7749
        explode: true
        in: query
        name: lat
        required: true
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
        style: form
      - description: Longitude (-180 to 180). Must be a finite number; see `lat`.
        example: -122.4194
        explode: true
        in: query
        name: lon
        required: true
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
        style: form
      - $ref: "#/components/parameters/lang"
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - geoname_id: 6252001
                  name: United States
                  type: country
                  depth: 0
                - geoname_id: 5332921
                  name: California
                  type: region
                  depth: 1
                meta:
                  count: 2
              schema:
                $ref: "#/components/schemas/HierarchyListResponse"
          description: |-
            The administrative chain covering the coordinate, country first.

            A ONE-ELEMENT RESPONSE IS A NORMAL SUCCESS, not a degraded answer: 3.8% of the corpus resolves to a country with no covering region. Do not treat a short chain as an error.
        "400":
          content:
            application/json:
              example:
                error:
                  code: bad_request
                  message: lat must be between -90 and 90
                  request_id: req_abc123
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |-
            A missing, unparseable, non-finite or out-of-range `lat` or `lon`.

            NOTE THE STATUS. Parameter failures on THIS endpoint are 400 `bad_request`, mirroring `/v1/reverse`, whose parameter contract this endpoint deliberately copies so that the generated SDK method reads `resolve(lat, lon)` beside `reverse(lat, lon)`. That is a different convention from `?simplify=` on `/v1/boundaries/{geoname_id}`, which is a 422 `validation_error` with per-field `error.details`. The two are separate conventions on purpose, not an inconsistency to be harmonised away — treat them as two shapes when writing a client.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ResolveNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ResolveQueryTimeout"
      summary: Resolve coordinates to their containing administrative areas
      tags:
      - Search
      x-quota-cost:
        base: 1
      x-codeSamples:
      - lang: curl
        source: |
          curl -H "X-API-Key: YOUR_KEY" \
            "https://geosearch.dev/v1/resolve?lat=37.7749&lon=-122.4194"
      - lang: Go
        source: |
          // go get github.com/geosearch-dev/geosearch-go
          client := geosearch.NewAPIClient(geosearch.NewConfiguration())
          ctx := context.WithValue(context.Background(), geosearch.ContextAPIKeys,
              map[string]geosearch.APIKey{"apiKeyAuth": {Key: "YOUR_KEY"}})
          areas, _, err := client.SearchAPI.ResolveCoordinate(ctx).
              Lat(37.7749).Lon(-122.4194).Execute()
      - lang: Python
        source: |
          # pip install git+https://github.com/geosearch-dev/geosearch-python.git
          import geosearch

          cfg = geosearch.Configuration(api_key={"apiKeyAuth": "YOUR_KEY"})
          with geosearch.ApiClient(cfg) as client:
              areas = geosearch.SearchApi(client).resolve_coordinate(37.7749, -122.4194).data
      - lang: TypeScript
        source: |
          // npm install github:geosearch-dev/geosearch-typescript
          import { Configuration, SearchApi } from "@geosearch/client";

          const api = new SearchApi(new Configuration({ apiKey: "YOUR_KEY" }));
          const areas = (await api.resolveCoordinate({ lat: 37.7749, lon: -122.4194 })).data;
      - lang: Ruby
        source: |
          # gem 'geosearch', git: 'https://github.com/geosearch-dev/geosearch-ruby.git'
          require "geosearch"

          GeoSearch.configure { |c| c.api_key["X-API-Key"] = "YOUR_KEY" }
          areas = GeoSearch::SearchApi.new.resolve_coordinate(37.7749, -122.4194).data
      - lang: PHP
        source: |
          // composer config repositories.geosearch vcs https://github.com/geosearch-dev/geosearch-php.git
          // composer require geosearch-dev/geosearch-php
          $cfg = GeoSearch\Configuration::getDefaultConfiguration()
              ->setApiKey("X-API-Key", "YOUR_KEY");
          $areas = (new GeoSearch\Api\SearchApi(null, $cfg))->resolveCoordinate(37.7749, -122.4194)->getData();
  /v1/boundaries/{geoname_id}:
    get:
      description: |
        Returns the boundary polygon for one country or region as a bare GeoJSON
        geometry.

        ## COSTS 5 QUOTA UNITS

        This endpoint charges five units against the monthly quota, not one. The
        premium is priced on PAYLOAD rather than on query time: country GeoJSON
        averages 62.6 KB and reaches 1.9 MB, and region GeoJSON reaches 2.8 MB —
        two to three orders of magnitude above an ordinary list response.

        `?simplify=` does NOT reduce the cost. It trades server CPU for client
        bytes (simplification measures 209–248 ms against 10.3 ms for the plain
        fetch), so the route is expensive to serve either way.

        REJECTIONS COST ONE UNIT, NOT FIVE. A 400, a 422, either 404 and the 403
        below all charge the standard single unit, so probing which ids are
        fetchable — and bouncing off the paywall — is not billed at the premium
        rate. Only a request that actually reaches the polygon fetch is charged
        five, including one that reaches it and then times out.

        ## Plan requirements

        REGION boundaries require a paid plan. COUNTRY boundaries are available
        on every plan, including Free. A Free key requesting a region boundary
        receives a 403 `tier_upgrade_required` carrying an upgrade link — a
        visible refusal, not a silent omission.

        This is the same split the `geometry` field follows on the country and
        region endpoints, with one deliberate difference: there the field is
        simply absent from a 200, while here the refusal is explicit and tells
        you what to do about it.

        ## Response shape

        `data.geometry` is a BARE GeoJSON geometry — the `{"type": ...,
        "coordinates": ...}` object — and NOT a GeoJSON `Feature`. There is no
        `properties` wrapper; the three sibling fields carry that information.
        This matches the geometry `/v1/countries/{code}` and `/v1/regions/{id}`
        already return.

        `type` is `Polygon` OR `MultiPolygon`. Do not pin it: applying
        `?simplify=` can collapse a MultiPolygon into a Polygon for areas whose
        smaller parts disappear at the requested tolerance.

        `?fields=` IS NOT SUPPORTED on this endpoint and is ignored if sent.
        Field selection here works by serialising the whole object and then
        dropping keys, so `?fields=name` on a 1.9 MB polygon would build the
        polygon in full and discard it — strictly more expensive than not
        sending the parameter. Callers who want only the name should use
        `/v1/countries/{code}` or `/v1/regions/{id}`.
      operationId: getBoundary
      parameters:
      - description: "GeoNames id of a country or a region. A city id — or any id\
          \ that does not name an area — is a 404 `area_not_an_area`, not a 400."
        example: 6252001
        explode: false
        in: path
        name: geoname_id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: |-
          Douglas-Peucker tolerance in EPSG:4326 DEGREES, applied before the polygon is serialised. Omit it for full precision.

          DEGREES, NOT METRES. The upper bound of 10 is roughly 1,100 km, chosen to make the unit obviously wrong to anyone who typed a value in metres. Simplification stops changing the shape above about 1 degree, so values beyond that buy nothing.

          `0` is accepted and is a no-op: the response reports `simplify: null`, because no tolerance was actually applied.

          A negative, non-finite or out-of-range value is a 422, never a 500.

          SUPPLY IT AT MOST ONCE. `?simplify=0.01&simplify=0.5` is a 422 rather than a request served with one of the two values silently dropped: two tolerances are two conflicting instructions, and the server does not guess which was meant.
        example: 0.01
        explode: true
        in: query
        name: simplify
        required: false
        schema:
          format: double
          maximum: 10
          minimum: 0
          type: number
        style: form
      - $ref: "#/components/parameters/lang"
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  geoname_id: 6252001
                  name: United States
                  type: country
                  geometry:
                    type: MultiPolygon
                    coordinates:
                    - - - - -124.7
                          - 48.4
                        - - -124.6
                          - 48.4
                        - - -124.6
                          - 48.3
                        - - -124.7
                          - 48.4
                  simplify: null
              schema:
                $ref: "#/components/schemas/BoundarySingleResponse"
          description: The area's boundary polygon.
        "400":
          content:
            application/json:
              example:
                error:
                  code: bad_request
                  message: invalid boundary geoname_id
                  request_id: req_abc123
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The path segment is not an integer. A malformed id is a 400\
            \ rather than a 404, so a typo is distinguishable from a coverage gap."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TierUpgradeRequired"
        "404":
          $ref: "#/components/responses/BoundaryNotFound"
        "422":
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Validation failed
                  details:
                  - field: simplify
                    issue: "must not be negative; a tolerance is a distance, and PostGIS\
                      \ refuses a negative one"
                  request_id: req_abc123
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |-
            `simplify` was malformed. `error.details` names the field and what was wrong with it.

            A 422 HERE, WHERE `/v1/resolve` USES 400 FOR ITS COORDINATES. That is deliberate: this is a shape failure decidable from the request text alone and it has a field name to report, which is this API's 422 convention. The two endpoints follow two conventions; see the 400 on `/v1/resolve`.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/BoundaryQueryTimeout"
      summary: Fetch an area's boundary polygon as GeoJSON
      tags:
      - Boundaries
      x-quota-cost:
        base: 5
      x-codeSamples:
      - lang: curl
        source: |
          curl -H "X-API-Key: YOUR_KEY" \
            "https://geosearch.dev/v1/boundaries/6252001?simplify=0.01"
      - lang: Go
        source: |
          // go get github.com/geosearch-dev/geosearch-go
          client := geosearch.NewAPIClient(geosearch.NewConfiguration())
          ctx := context.WithValue(context.Background(), geosearch.ContextAPIKeys,
              map[string]geosearch.APIKey{"apiKeyAuth": {Key: "YOUR_KEY"}})
          boundary, _, err := client.BoundariesAPI.GetBoundary(ctx, 6252001).
              Simplify(0.01).Execute()
      - lang: Python
        source: |
          # pip install git+https://github.com/geosearch-dev/geosearch-python.git
          import geosearch

          cfg = geosearch.Configuration(api_key={"apiKeyAuth": "YOUR_KEY"})
          with geosearch.ApiClient(cfg) as client:
              boundary = geosearch.BoundariesApi(client).get_boundary(6252001, simplify=0.01).data
      - lang: TypeScript
        source: |
          // npm install github:geosearch-dev/geosearch-typescript
          import { Configuration, BoundariesApi } from "@geosearch/client";

          const api = new BoundariesApi(new Configuration({ apiKey: "YOUR_KEY" }));
          const boundary = (await api.getBoundary({ geonameId: 6252001, simplify: 0.01 })).data;
      - lang: Ruby
        source: |
          # gem 'geosearch', git: 'https://github.com/geosearch-dev/geosearch-ruby.git'
          require "geosearch"

          GeoSearch.configure { |c| c.api_key["X-API-Key"] = "YOUR_KEY" }
          boundary = GeoSearch::BoundariesApi.new.get_boundary(6252001, simplify: 0.01).data
      - lang: PHP
        source: |
          // composer config repositories.geosearch vcs https://github.com/geosearch-dev/geosearch-php.git
          // composer require geosearch-dev/geosearch-php
          $cfg = GeoSearch\Configuration::getDefaultConfiguration()
              ->setApiKey("X-API-Key", "YOUR_KEY");
          $boundary = (new GeoSearch\Api\BoundariesApi(null, $cfg))->getBoundary(6252001, 0.01)->getData();
